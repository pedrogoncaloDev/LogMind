name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  back_end-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back_end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: back_end/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_PORT: 5432
          DB_HOST: localhost
          API_URL: http://localhost:5000
          SECRET_KEY: ci-secret-key-for-tests-only
        run: pytest
